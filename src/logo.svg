<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="45%" stop-color="#6d28d9" />
      <stop offset="80%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Rose-Violet Wing Gradient -->
    <linearGradient id="roseWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Cyan-Violet Glow Gradient -->
    <linearGradient id="glowViolet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#c084fc" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.95" />
    </linearGradient>

    <!-- Inner Shadow / Glow filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f0728" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base Rounded Badge -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" filter="url(#dropShadow)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.35" />

  <!-- Geometric Luxury Ring (Concentric Accent) -->
  <circle cx="256" cy="256" r="186" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-dasharray="6 8" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="162" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15" />

  <!-- Stylized Hair Wave / Beauty Crest (Left Petal) -->
  <path d="M 145 285 C 130 200, 190 120, 256 120 C 230 180, 200 230, 145 285 Z" fill="url(#roseWing)" opacity="0.85" filter="url(#softGlow)" />

  <!-- Stylized Hair Wave / Beauty Crest (Right Petal) -->
  <path d="M 367 285 C 382 200, 322 120, 256 120 C 282 180, 312 230, 367 285 Z" fill="url(#glowViolet)" opacity="0.85" filter="url(#softGlow)" />

  <!-- Flowing Center Ribbon Crown / S Crest (Salonix 'S') -->
  <path d="M 285 145 C 315 155, 335 185, 330 215 C 322 255, 260 260, 245 290 C 230 320, 250 350, 280 355 C 250 365, 215 350, 210 320 C 202 275, 275 270, 285 240 C 295 210, 275 190, 248 185 C 220 180, 195 195, 185 220 C 185 175, 235 135, 285 145 Z" fill="url(#goldGrad)" filter="url(#softGlow)" />

  <!-- Modern Hair Shears / Scissors Iconography (Precision Crafting) -->
  <!-- Blade 1 -->
  <path d="M 205 355 L 256 268 L 298 198 C 304 188, 301 176, 290 170 C 280 165, 268 170, 262 180 L 225 245 L 180 320 C 168 340, 185 365, 205 355 Z" fill="#ffffff" opacity="0.95" />
  <!-- Blade 2 -->
  <path d="M 307 355 L 256 268 L 214 198 C 208 188, 211 176, 222 170 C 232 165, 244 170, 250 180 L 287 245 L 332 320 C 344 340, 327 365, 307 355 Z" fill="#ffffff" opacity="0.95" />

  <!-- Scissor Pivot Gem / Diamond Core -->
  <circle cx="256" cy="268" r="16" fill="url(#goldGrad)" filter="url(#dropShadow)" />
  <circle cx="256" cy="268" r="8" fill="#ffffff" />
  <circle cx="256" cy="268" r="4" fill="#6d28d9" />

  <!-- Left Finger Ring Loop -->
  <circle cx="185" cy="358" r="28" fill="none" stroke="url(#goldGrad)" stroke-width="7" />
  <circle cx="185" cy="358" r="16" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6" />

  <!-- Right Finger Ring Loop -->
  <circle cx="327" cy="358" r="28" fill="none" stroke="url(#goldGrad)" stroke-width="7" />
  <circle cx="327" cy="358" r="16" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6" />

  <!-- Sparkles / Luxury Starbursts -->
  <!-- Top Center Sparkle -->
  <path d="M 256 78 Q 256 98 266 98 Q 256 98 256 118 Q 256 98 246 98 Q 256 98 256 78 Z" fill="url(#goldGrad)" />
  <circle cx="256" cy="98" r="3" fill="#ffffff" />

  <!-- Top Right Sparkle -->
  <path d="M 380 135 Q 380 150 388 150 Q 380 150 380 165 Q 380 150 372 150 Q 380 150 380 135 Z" fill="url(#goldGrad)" />
  <circle cx="380" cy="150" r="2.5" fill="#ffffff" />

  <!-- Top Left Sparkle -->
  <path d="M 132 145 Q 132 158 139 158 Q 132 158 132 171 Q 132 158 125 158 Q 132 158 132 145 Z" fill="#ffffff" opacity="0.85" />
  
  <!-- Subtle Bottom Star -->
  <circle cx="256" cy="412" r="3.5" fill="url(#goldGrad)" />
  <circle cx="230" cy="412" r="2" fill="url(#goldGrad)" opacity="0.7" />
  <circle cx="282" cy="412" r="2" fill="url(#goldGrad)" opacity="0.7" />
</svg>
